<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALCASAR Login</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>ALCASAR Login</h1>
      <button id="settingsBtn" class="btn-settings" title="settings">⚙️</button>
    </div>

    <div id="loginSection" class="login-section">
      <!-- Two-line structure: name sits above, state below. JS fills these. -->
      <button id="loginNow" class="btn-login">
        <span id="btnSub" class="btn-sub"></span>
        <span id="btnMain" class="btn-main">Login</span>
      </button>
      <div id="loginStatus" class="status"></div>
    </div>

    <!-- Settings panel (gear) — credentials + floating toggle inside -->
    <div id="settingsPanel" style="display:none;">
      <div class="divider"></div>

      <div class="form-group">
        <label for="username">username</label>
        <input type="text" id="username" name="username" placeholder="your username">
      </div>

      <div class="form-group">
        <label for="password">password</label>
        <input type="password" id="password" name="password" placeholder="your password">
      </div>

      <button id="saveCredentials" class="btn-primary">Save</button>

      <div class="toggle-row">
        <span class="toggle-label">Floating button</span>
        <label class="toggle-switch">
          <input type="checkbox" id="floatingToggle" checked>
          <span class="toggle-track">
            <span class="toggle-thumb"></span>
          </span>
        </label>
      </div>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
